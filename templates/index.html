<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shayloader - MP4 and MP3 Downloader</title>
  <link rel="icon" href="/static/shayloader-logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #05070a;
      --fg: #f7f8fa;
      --muted: #9aa3ad;
      --soft: #151922;
      --line: #272d38;
      --field: #0c1017;
      --accent: #8fd3ff;
      --accent-ink: #061018;
      --success: #70d69b;
      --error: #ff7488;
      --shimmer: linear-gradient(100deg, #101620 20%, #1a222d 45%, #101620 70%);
      color-scheme: dark;
    }

    body[data-theme="light"] {
      --bg: #f7fbff;
      --fg: #101820;
      --muted: #667481;
      --soft: #edf6fb;
      --line: #d7e6ef;
      --field: #ffffff;
      --accent: #8fd3ff;
      --accent-ink: #061018;
      --success: #287f59;
      --error: #cf3f58;
      --shimmer: linear-gradient(100deg, #eaf5fb 20%, #ffffff 45%, #eaf5fb 70%);
      color-scheme: light;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--fg);
      font-family: 'Sora', sans-serif;
      transition: background 160ms ease, color 160ms ease;
    }

    button,
    textarea {
      font: inherit;
    }

    button {
      min-height: 44px;
      cursor: pointer;
    }

    .page {
      width: min(720px, calc(100% - 32px));
      min-height: 100dvh;
      margin: 0 auto;
      padding: clamp(26px, 5vw, 56px) 0 28px;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .theme-row {
      display: flex;
      justify-content: flex-end;
      min-height: 44px;
    }

    .theme-toggle {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 0;
      background: transparent;
      color: var(--muted);
      transition: color 140ms ease, border-color 140ms ease;
    }

    .theme-toggle:hover {
      color: var(--fg);
      border-color: var(--fg);
    }

    .theme-toggle svg {
      width: 19px;
      height: 19px;
    }

    .moon-icon,
    body[data-theme="light"] .sun-icon {
      display: none;
    }

    body[data-theme="light"] .moon-icon {
      display: block;
    }

    .logo {
      display: block;
      width: min(270px, 72vw);
      height: auto;
      margin: -8px auto 4px;
    }

    .intro {
      margin: 0 auto;
      color: var(--muted);
      text-align: center;
      line-height: 1.55;
      max-width: 44rem;
      font-size: 0.98rem;
    }

    .tool {
      display: grid;
      gap: 12px;
      margin-top: 6px;
    }

    label {
      color: var(--fg);
      font-size: 0.9rem;
      font-weight: 600;
    }

    textarea {
      width: 100%;
      min-height: 118px;
      padding: 15px;
      border: 1px solid var(--line);
      border-radius: 0;
      outline: none;
      resize: vertical;
      background: var(--field);
      color: var(--fg);
      font-size: 1rem;
      line-height: 1.5;
      transition: border-color 140ms ease;
    }

    textarea:focus {
      border-color: var(--accent);
    }

    textarea::placeholder {
      color: color-mix(in srgb, var(--muted) 78%, transparent);
    }

    .hint {
      margin: -2px 0 0;
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.45;
    }

    .controls {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 10px;
    }

    .format-group {
      display: grid;
      grid-template-columns: repeat(2, minmax(68px, 1fr));
      border: 1px solid var(--line);
    }

    .pill,
    .fetch-btn,
    .card-dl-btn,
    .dl-all-btn,
    .q-chip {
      border-radius: 0;
      font-weight: 700;
      letter-spacing: 0;
      transition: background 140ms ease, color 140ms ease, border-color 140ms ease, opacity 140ms ease;
    }

    .pill {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 10px 16px;
    }

    .pill + .pill {
      border-left: 1px solid var(--line);
    }

    .pill.active {
      background: var(--accent);
      color: var(--accent-ink);
    }

    .fetch-btn,
    .card-dl-btn,
    .dl-all-btn {
      border: 1px solid var(--accent);
      background: var(--accent);
      color: var(--accent-ink);
      padding: 10px 16px;
    }

    .fetch-btn:hover,
    .card-dl-btn:hover,
    .dl-all-btn:hover {
      background: transparent;
      color: var(--accent);
    }

    .fetch-btn:disabled,
    .card-dl-btn:disabled,
    .dl-all-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .cards {
      display: grid;
      gap: 10px;
      margin-top: 10px;
    }

    .card {
      display: grid;
      grid-template-columns: 118px minmax(0, 1fr);
      gap: 14px;
      align-items: center;
      padding: 10px 0;
      border-top: 1px solid var(--line);
    }

    .card:last-child {
      border-bottom: 1px solid var(--line);
    }

    .card-thumb {
      width: 118px;
      height: 76px;
      overflow: hidden;
      background: var(--soft);
    }

    .card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-thumb .no-thumb,
    .card-error-icon {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      color: var(--muted);
    }

    .card-thumb svg,
    .card-error-icon svg {
      width: 26px;
      height: 26px;
    }

    .card-thumb.loading,
    .skeleton-line {
      background: var(--shimmer);
      background-size: 220% 100%;
      animation: shimmer 1.3s ease-in-out infinite;
    }

    .skeleton-line {
      height: 12px;
      margin-bottom: 8px;
    }

    .skeleton-line.medium { width: 78%; }
    .skeleton-line.short { width: 42%; height: 10px; }

    @keyframes shimmer {
      from { background-position: 180% 0; }
      to { background-position: -180% 0; }
    }

    .card-body {
      min-width: 0;
    }

    .card-title {
      margin-bottom: 4px;
      color: var(--fg);
      font-size: 0.96rem;
      font-weight: 700;
      line-height: 1.28;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .card-meta,
    .card-status,
    .card-error-url {
      color: var(--muted);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.7rem;
      line-height: 1.4;
    }

    .card-meta {
      margin-bottom: 9px;
      overflow-wrap: anywhere;
    }

    .card-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px;
    }

    .card-dl-btn {
      min-height: 36px;
      padding: 7px 12px;
      font-size: 0.82rem;
    }

    .card-dl-btn.done {
      border-color: var(--success);
      background: var(--success);
      color: #061018;
    }

    .q-chip {
      min-height: 34px;
      padding: 7px 10px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.68rem;
    }

    .q-chip.active {
      border-color: var(--accent);
      color: var(--accent);
    }

    .card-status.downloading {
      color: var(--accent);
    }

    .card-status.done { color: var(--success); }
    .card-status.error,
    .card-error-msg { color: var(--error); }

    .card.card-error {
      border-top-color: color-mix(in srgb, var(--error) 50%, var(--line));
    }

    .card-error-icon {
      color: var(--error);
    }

    .card-error-msg {
      margin-top: 3px;
      font-size: 0.84rem;
      line-height: 1.45;
    }

    .card-error-url {
      margin-top: 5px;
      word-break: break-all;
    }

    .dl-all-bar {
      display: grid;
      margin-top: 3px;
    }

    .sites {
      margin-top: auto;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      overflow: hidden;
    }

    .sites-label {
      margin-bottom: 11px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.7rem;
      font-weight: 600;
    }

    .marquee {
      display: flex;
      overflow: hidden;
      mask-image: linear-gradient(90deg, transparent, #000 7%, #000 93%, transparent);
    }

    .marquee-track {
      display: flex;
      gap: 22px;
      width: max-content;
      padding-right: 22px;
      animation: roll 38s linear infinite;
    }

    @keyframes roll {
      from { transform: translate3d(0, 0, 0); }
      to { transform: translate3d(-50%, 0, 0); }
    }

    .site {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 600;
    }

    .site img {
      width: 16px;
      height: 16px;
      object-fit: contain;
      display: block;
      opacity: 0.9;
    }

    .site-fallback {
      color: var(--accent);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.72rem;
      font-weight: 700;
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 1ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 1ms !important;
      }

      .marquee-track {
        animation: none !important;
        flex-wrap: wrap;
      }
    }

    @media (max-width: 560px) {
      .page {
        width: min(100% - 22px, 520px);
      }

      .logo {
        width: min(240px, 78vw);
      }

      .controls {
        grid-template-columns: 1fr;
      }

      .card {
        grid-template-columns: 1fr;
      }

      .card-thumb {
        width: 100%;
        height: auto;
        aspect-ratio: 16 / 9;
      }

      .card-title {
        white-space: normal;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="theme-row">
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to light mode" title="Switch theme">
        <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20.6 14.4A8 8 0 0 1 9.6 3.4a8.8 8.8 0 1 0 11 11Z"></path>
        </svg>
        <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2"></path>
          <path d="M12 20v2"></path>
          <path d="M2 12h2"></path>
          <path d="M20 12h2"></path>
          <path d="m4.93 4.93 1.41 1.41"></path>
          <path d="m17.66 17.66 1.41 1.41"></path>
          <path d="m6.34 17.66-1.41 1.41"></path>
          <path d="m19.07 4.93-1.41 1.41"></path>
        </svg>
      </button>
    </div>

    <img class="logo" src="/static/shayloader-logo.png" alt="Shayloader">
    <p class="intro">Paste a link, choose MP4 or MP3, download when ready.</p>

    <section class="tool" aria-label="Download controls">
      <label for="urls">Links</label>
      <textarea id="urls" placeholder="Paste YouTube, TikTok, Instagram, SoundCloud, and more..." rows="4"></textarea>
      <p class="hint">Use spaces, commas, or new lines for multiple links.</p>

      <div class="controls">
        <div class="format-group" aria-label="Download format">
          <button class="pill active" type="button" data-format="video" onclick="setFormat(this)">MP4</button>
          <button class="pill" type="button" data-format="audio" onclick="setFormat(this)">MP3</button>
        </div>
        <button class="fetch-btn" id="goBtn" type="button" onclick="go()">Fetch</button>
      </div>

      <div id="cards" class="cards" aria-live="polite"></div>
    </section>

    <footer class="sites" aria-label="Supported apps">
      <div class="sites-label">Supported sites</div>
      <div class="marquee">
        <div class="marquee-track" id="siteTrack" aria-hidden="true"></div>
      </div>
    </footer>
  </main>

  <script>
    const THEME_KEY = 'shayloader-theme';
    const supportedSites = [
      { name: 'YouTube', slug: 'youtube', brand: 'ff0033' },
      { name: 'TikTok', slug: 'tiktok', brand: 'ffffff' },
      { name: 'Instagram', slug: 'instagram', brand: 'e4405f' },
      { name: 'X', slug: 'x', brand: 'ffffff' },
      { name: 'Reddit', slug: 'reddit', brand: 'ff4500' },
      { name: 'Facebook', slug: 'facebook', brand: '0866ff' },
      { name: 'Vimeo', slug: 'vimeo', brand: '1ab7ea' },
      { name: 'Twitch', slug: 'twitch', brand: '9146ff' },
      { name: 'Dailymotion', slug: 'dailymotion', brand: '0066dc' },
      { name: 'SoundCloud', slug: 'soundcloud', brand: 'ff5500' },
      { name: 'Loom', slug: 'loom', brand: '625df5' },
      { name: 'Streamable', fallback: 'S' },
      { name: 'Pinterest', slug: 'pinterest', brand: 'bd081c' },
      { name: 'Tumblr', slug: 'tumblr', brand: 'ffffff' },
      { name: 'Threads', slug: 'threads', brand: 'ffffff' },
      { name: 'LinkedIn', slug: 'linkedin', brand: '0a66c2' },
      { name: '1000+ more', fallback: '+' },
    ];

    let currentFormat = 'video';
    let cardData = [];

    function iconUrl(site) {
      if (!site.slug) return '';
      return `https://cdn.simpleicons.org/${site.slug}/${site.brand}`;
    }

    function renderSupportedSites() {
      const track = document.getElementById('siteTrack');
      const items = [...supportedSites, ...supportedSites];
      track.innerHTML = items.map(site => {
        const logo = site.slug
          ? `<img src="${attr(iconUrl(site))}" alt="" loading="lazy" onerror="this.replaceWith(document.createTextNode('${attr(site.fallback || site.name.charAt(0))}'))">`
          : `<span class="site-fallback">${esc(site.fallback || site.name.charAt(0))}</span>`;
        return `<span class="site">${logo}<span>${esc(site.name)}</span></span>`;
      }).join('');
    }

    function applyTheme(theme) {
      document.body.dataset.theme = theme;
      const toggle = document.getElementById('themeToggle');
      const nextTheme = theme === 'light' ? 'dark' : 'light';
      toggle.setAttribute('aria-label', `Switch to ${nextTheme} mode`);
    }

    function initTheme() {
      applyTheme(localStorage.getItem(THEME_KEY) || 'dark');
    }

    document.getElementById('themeToggle').addEventListener('click', () => {
      const next = document.body.dataset.theme === 'light' ? 'dark' : 'light';
      localStorage.setItem(THEME_KEY, next);
      applyTheme(next);
    });

    function setFormat(btn) {
      document.querySelectorAll('.pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFormat = btn.dataset.format;
      cardData.forEach((card, idx) => {
        if (card.status && card.status !== 'loading' && card.status !== 'info-error') {
          renderCard(idx);
        }
      });
    }

    function parseUrls(text) {
      return [...new Set(text.split(/[\s,]+/).map(u => u.trim()).filter(u => u.startsWith('http')))];
    }

    function fmtDur(s) {
      if (!s) return '';
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return `${m}:${sec.toString().padStart(2, '0')}`;
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    function attr(s) {
      return esc(s).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function friendlyError(err) {
      if (err.includes('Unsupported URL')) return 'This URL is not supported';
      if (err.includes('Video unavailable')) return 'Video is unavailable or private';
      if (err.includes('Private video')) return 'This video is private';
      if (err.includes('HTTP Error 403')) return 'Access denied by the platform';
      if (err.includes('HTTP Error 404')) return 'Video not found';
      if (err.includes('copyright')) return 'Video blocked due to copyright';
      if (err.includes('geo')) return 'Video not available in your region';
      if (err.includes('timed out') || err.includes('Timed out')) return 'Request timed out - try again';
      if (err.includes('network') || err.includes('Network')) return 'Network error - check your connection';
      return err.length > 80 ? err.slice(0, 80) + '...' : err;
    }

    document.getElementById('urls').addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        go();
      }
    });

    async function go() {
      const urls = parseUrls(document.getElementById('urls').value);
      if (!urls.length) return;

      const btn = document.getElementById('goBtn');
      const container = document.getElementById('cards');
      btn.disabled = true;
      btn.textContent = 'Loading...';
      container.innerHTML = '';
      cardData = [];

      for (let i = 0; i < urls.length; i++) {
        const url = urls[i];
        const idx = cardData.length;
        cardData.push({ url, status: 'loading' });
        renderCard(idx);

        try {
          const res = await fetch('/api/info', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url }),
          });
          const data = await res.json();
          if (data.error) {
            cardData[idx] = { ...cardData[idx], status: 'info-error', error: data.error };
          } else {
            cardData[idx] = {
              ...cardData[idx],
              status: 'ready',
              title: data.title || '',
              thumbnail: data.thumbnail || '',
              duration: data.duration,
              uploader: data.uploader || '',
              formats: data.formats || [],
              selectedFormatId: data.formats?.[0]?.id || null,
            };
          }
        } catch (err) {
          cardData[idx] = { ...cardData[idx], status: 'info-error', error: err.message };
        }
        renderCard(idx);
      }

      if (cardData.filter(c => c.status === 'ready').length > 1) {
        renderDownloadAll();
      }

      btn.disabled = false;
      btn.textContent = 'Fetch';
    }

    function renderCard(idx) {
      const c = cardData[idx];
      let el = document.getElementById(`card-${idx}`);
      if (!el) {
        el = document.createElement('div');
        el.id = `card-${idx}`;
        el.className = 'card';
        document.getElementById('cards').appendChild(el);
      }

      if (c.status === 'loading') {
        el.className = 'card';
        el.innerHTML = `
          <div class="card-thumb loading"></div>
          <div class="card-body">
            <div class="skeleton-line medium"></div>
            <div class="skeleton-line short"></div>
          </div>
        `;
        return;
      }

      if (c.status === 'info-error') {
        el.className = 'card card-error';
        el.innerHTML = `
          <div class="card-thumb">
            <div class="card-error-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
            </div>
          </div>
          <div class="card-body">
            <div class="card-title" style="color:var(--error)">Could not fetch video</div>
            <div class="card-error-msg">${esc(friendlyError(c.error || ''))}</div>
            <div class="card-error-url">${esc(c.url)}</div>
          </div>
        `;
        return;
      }

      el.className = 'card';
      const isAudio = currentFormat === 'audio';

      let thumbHtml;
      if (isAudio) {
        thumbHtml = `<div class="no-thumb"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M8 5.14v13.72c0 .78.86 1.25 1.52.82l10.47-6.86a.98.98 0 0 0 0-1.64L9.52 4.32A.98.98 0 0 0 8 5.14Z"/></svg></div>`;
      } else if (c.thumbnail) {
        thumbHtml = `<img src="${attr(c.thumbnail)}" alt="">`;
      } else {
        thumbHtml = `<div class="no-thumb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="0"/><circle cx="8" cy="8" r="1.5"/><path d="m21 15-5-5L5 21"/></svg></div>`;
      }

      let qualityChips = '';
      if (!isAudio && c.formats && c.formats.length > 1) {
        qualityChips = c.formats.map(f =>
          `<button class="q-chip${f.id === c.selectedFormatId ? ' active' : ''}" type="button" data-format-id="${attr(f.id)}" onclick="pickFormatFromButton(${idx}, this)">${esc(f.label)}</button>`
        ).join('');
      }

      let actionHtml = '';
      if (c.status === 'ready') {
        actionHtml = `<button class="card-dl-btn" type="button" onclick="dlCard(${idx})">Download</button>${qualityChips}`;
      } else if (c.status === 'downloading') {
        actionHtml = `<span class="card-status downloading">Downloading...</span>`;
      } else if (c.status === 'done') {
        actionHtml = `<button class="card-dl-btn done" type="button" onclick="saveCard(${idx})">Save</button>
          <span class="card-status done">${esc(c.filename || '')}</span>`;
      } else if (c.status === 'error') {
        actionHtml = `<button class="card-dl-btn" type="button" onclick="dlCard(${idx})">Retry</button>
          <span class="card-status error">${esc(friendlyError(c.error || 'Download failed'))}</span>`;
      }

      el.innerHTML = `
        <div class="card-thumb">${thumbHtml}</div>
        <div class="card-body">
          <div class="card-title">${esc(c.title || 'Untitled')}</div>
          <div class="card-meta">${esc(c.uploader)}${c.duration ? ' - ' + fmtDur(c.duration) : ''}</div>
          <div class="card-actions">${actionHtml}</div>
        </div>
      `;
    }

    function renderDownloadAll() {
      const existing = document.getElementById('dl-all-bar');
      if (existing) existing.remove();

      const bar = document.createElement('div');
      bar.id = 'dl-all-bar';
      bar.className = 'dl-all-bar';
      bar.innerHTML = `<button class="dl-all-btn" type="button" onclick="dlAll()">Download All</button>`;
      document.getElementById('cards').appendChild(bar);
    }

    function pickFormat(idx, formatId) {
      cardData[idx].selectedFormatId = formatId;
      renderCard(idx);
    }

    function pickFormatFromButton(idx, btn) {
      pickFormat(idx, btn.dataset.formatId);
    }

    async function dlCard(idx) {
      const c = cardData[idx];
      c.status = 'downloading';
      c.error = null;
      renderCard(idx);

      try {
        const res = await fetch('/api/download', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            url: c.url,
            format: currentFormat,
            format_id: c.selectedFormatId,
            title: c.title || '',
          }),
        });
        const data = await res.json();
        if (data.error) {
          c.status = 'error';
          c.error = data.error;
          renderCard(idx);
          return;
        }
        c.jobId = data.job_id;
        pollCard(idx);
      } catch (err) {
        c.status = 'error';
        c.error = err.message;
        renderCard(idx);
      }
    }

    function pollCard(idx) {
      const c = cardData[idx];
      const iv = setInterval(async () => {
        try {
          const res = await fetch(`/api/status/${c.jobId}`);
          const data = await res.json();
          if (data.status === 'done') {
            clearInterval(iv);
            c.status = 'done';
            c.filename = data.filename;
            renderCard(idx);
            saveCard(idx);
          } else if (data.status === 'error') {
            clearInterval(iv);
            c.status = 'error';
            c.error = data.error;
            renderCard(idx);
          }
        } catch {
          clearInterval(iv);
          c.status = 'error';
          c.error = 'Lost connection to server';
          renderCard(idx);
        }
      }, 1000);
    }

    function saveCard(idx) {
      const c = cardData[idx];
      if (!c.jobId) return;
      const a = document.createElement('a');
      a.href = `/api/file/${c.jobId}`;
      a.download = c.filename || '';
      a.click();
    }

    async function dlAll() {
      const btn = document.querySelector('.dl-all-btn');
      if (btn) {
        btn.disabled = true;
        btn.textContent = 'Downloading...';
      }

      for (let i = 0; i < cardData.length; i++) {
        if (cardData[i].status === 'ready') {
          await dlCard(i);
        }
      }

      if (btn) {
        btn.disabled = false;
        btn.textContent = 'Download All';
      }
    }

    initTheme();
    renderSupportedSites();
  </script>
</body>
</html>
